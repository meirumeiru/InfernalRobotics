		#LOC_IR_Parts_IR_Camera_title = Utilitron - Observer
		#LOC_IR_Parts_IR_Camera_description = This science part is able to perform EVA reports without the need for a Kerbal! Featuring an Artificial Intelligence programmed to react like a Kerbal, messages often include whitty comments about the places being reported on that our scientists say add to their authenticity. It also includes a light for night time operations.
		#LOC_IR_Parts_IR_DockingPort_title = Utilitron - Docker
		#LOC_IR_Parts_IR_DockingPort_description = After seeing the widespread use of the classic Clamp-O-Tron Jr. for moving payloads around with robotic contraptions, the design team at MSI came up with the ingenous idea of strapping on inside a fancy housing that matches the style of their own robot parts. Offering no extra features beyond the original, it's even being sold at the same price!
		#LOC_IR_Parts_IR_LandingFoot_title = Utilitron - Supporter Fold
		#LOC_IR_Parts_IR_LandingFoot_description = Sometimes a foot is needed but there is not a whole lot of space to put one. That's why MSI developed the Fold, a foldable foot that is designed to work with the Foldatron family of robotics parts! Note that unlike the other Supporter feet, this does not contain any suspension, so be gentle if landing with it. It does include a light though!
		#LOC_IR_Parts_IR_LargeSuspension_title = Utilitron - Supporter
		#LOC_IR_Parts_IR_LargeSuspension_description = The supporter family of parts can be used as feet for various robotic contraptions. This model is the full length version, making ideal for mounting on MSI's range of Extendatrons! It also includes suspension meaning it can survive use as a landing leg.
		#LOC_IR_Parts_IR_SmallSuspension_title = Utilitron - Supporter Half
		#LOC_IR_Parts_IR_SmallSuspension_description = The supporter family of parts can be used as feet for various robotic contraptions. This model is half the length of the regular version, making ideal for mounting on MSI's range of Half Extendatrons! It also includes suspension meaning it can survive use as a landing leg.
