		#LOC_IR_Parts_IR_SurfaceSampler_title = Utilitron - 采样器
		#LOC_IR_Parts_IR_SurfaceSampler_description = 这个科学部件无需凯伯尔就能从行星体和小行星采集表面样本！采集时部件必须非常靠近表面，钻头才能工作，因此建议安装在机械臂上。还带一盏灯，方便夜间作业。注意：它使用与观测器相同的人工智能分析样本，所以同样会收到关于采集物的俏皮评论。
