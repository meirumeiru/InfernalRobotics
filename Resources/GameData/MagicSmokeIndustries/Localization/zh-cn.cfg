		#LOC_IR_Parts_IR_DockingPort_title = Utilitron - 对接口
		#LOC_IR_Parts_IR_DockingPort_description = 看到经典的小型对接口在机器人装置中被广泛用来搬运载荷后，MSI 设计团队灵机一动，把它塞进了匹配自家机器人风格的华丽外壳里。除了外壳，功能与原版并无不同，甚至卖同样的价钱！
		#LOC_IR_Parts_IR_LandingFoot_title = Utilitron - 折叠支脚
		#LOC_IR_Parts_IR_LandingFoot_description = 有时需要支脚，却没有多少空间。于是 MSI 开发了折叠支脚，专为 Foldatron 系列机器人部件设计！注意：与其他支脚不同，它没有悬挂，着陆时请温柔一些。不过它带一盏灯！
